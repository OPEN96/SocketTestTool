name: 功能请求 / Feature Request
description: 提出新功能或改进建议 / Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem to Solve
      description: 这个功能解决什么使用场景下的痛点？/ What pain point does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案 / Proposed Solution
      description: 你希望它如何工作？/ How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives Considered
      description: 是否考虑过其他替代做法？/ Any alternative approaches you considered?
